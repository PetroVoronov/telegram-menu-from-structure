name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      -
        uses: actions/checkout@v7

      -
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      -
        run: npm ci

      -
        run: npm run lint-report

      -
        run: npm test -- --ci

      -
        run: npm run build
