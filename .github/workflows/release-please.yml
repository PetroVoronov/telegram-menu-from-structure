on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      -
        uses: googleapis/release-please-action@v5
        id: release
        with:
          # this assumes that you have created a personal access token
          # (PAT) and configured it as a GitHub action secret named
          # `MY_RELEASE_PLEASE_TOKEN` (this secret name is not important).
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          # optional. customize path to release-please-config.json
          config-file: release-please-config.json
          # optional. customize path to .release-please-manifest.json
          manifest-file: .release-please-manifest.json

      -
        uses: actions/checkout@v7
        # this step checks out the PR branch that was created by release-please
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJson(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}

      -
        uses: actions/setup-node@v7
        if: ${{ steps.release.outputs.pr }}
        with:
          node-version: 24

      -
        run: npm ci
        if: ${{ steps.release.outputs.pr }}

      -
        name: Run CHANGELOG.md through markdownlint-cli2
        if: ${{ steps.release.outputs.pr }}
        run: npx markdownlint-cli2 CHANGELOG.md --fix

      -
        name: Commit and push
        if: ${{ steps.release.outputs.pr }}
        uses: EndBug/add-and-commit@v11
        with:
          add: 'CHANGELOG.md'
          message: 'chore: run CHANGELOG.md through markdownlint-cli2'
          default_author: user_info

  # npm publication via trusted publishing (OIDC), runs only when a new release is created.
  # The trusted publisher on npmjs.com has to point to this workflow file: release-please.yml
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      checks: write
      issues: write
    steps:
      -
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      -
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      -
        name: Ensure npm supports trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))) ? 0 : 1)" "$(npm --version)" \
            || npm install -g npm@^11.5.1
          npm --version

      -
        run: npm ci

      -
        name: Run tests
        run: npm test -- --ci
        id: test

      -
        run: npm publish
        if: ${{ steps.test.conclusion == 'success' }}

      -
        name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        id: test-results
        if: ${{ failure() || success() }}
        with:
          check_name: "Test Results on Release (${{ github.event.workflow_run.event || github.event_name }})"
          files: "test-results/**/*.xml"
          comment_mode: "off"

      -
        name: Check URL
        if: ${{ failure() && steps.test.conclusion != 'success' }}
        run: |
          echo "CHECK_URL=${{ fromJSON( steps.test-results.outputs.json ).check_url }}" >> $GITHUB_ENV

      -
        name: Create issue if tests fail
        if: ${{ failure() && steps.test.conclusion != 'success' }}
        uses: actions/github-script@v9
        env:
          RELEASE_VERSION: ${{ needs.release-please.outputs.tag_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseVersion = process.env.RELEASE_VERSION;
            const checkUrl = process.env.CHECK_URL;
            const issueTitle = `Test Failure in Release Workflow for version ${releaseVersion}`;
            const issueBody = `
              The tests failed during the release workflow for version ${releaseVersion}.

              **Workflow:** ${context.workflow}
              **Job:** ${context.job}
              **Run:** ${context.runId}
              **Commit:** ${context.sha}

              Please check the [Test results](${checkUrl}) for more details.
            `;

            const existingIssues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'test-failure'
            });

            const issueExists = existingIssues.data.some(issue => issue.title === issueTitle);

            if (!issueExists) {
              await github.rest.issues.create({
                owner,
                repo,
                title: issueTitle,
                body: issueBody,
                labels: ['test-failure']
              });
            }
